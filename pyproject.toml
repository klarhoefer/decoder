[project]
name = "decoder"
version = "0.1.0"
description = "Einfaches PyTorch-Projekt: Modell trainieren und ausführen"
readme = "README.md"
authors = [
    { name = "Udo Klarhöfer", email = "klarhoefer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
]

[project.scripts]
decoder = "decoder:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
